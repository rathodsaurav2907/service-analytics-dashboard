name: Service Analytics Dashboard CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-warehouse:
    name: Validate PostgreSQL Warehouse & SQL Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: service_analytics
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize PostgreSQL Schema
        run: PGPASSWORD=analytics psql -h localhost -U analytics -d service_analytics -f database/init.sql

      - name: Seed Analytics Data
        run: PGPASSWORD=analytics psql -h localhost -U analytics -d service_analytics -f database/seed_data.sql

      - name: Execute Analytical SQL Integrity Tests
        run: PGPASSWORD=analytics psql -h localhost -U analytics -d service_analytics -f tests/test_queries.sql

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-24.04
    needs: validate-warehouse

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: service-analytics-dashboard:latest
